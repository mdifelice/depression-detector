[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
pidfile=/tmp/supervisord.pid

[program:backend]
command=/usr/local/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir /app/backend
environment=PYTHONPATH="/app/backend"
autorestart=true
startretries=5
startsecs=2

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startsecs=2