services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
      - FRONTEND_URL=http://localhost
    volumes:
      - app-data:/data
      - app-models:/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
  app-models:
